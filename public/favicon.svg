<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="robotMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00bbf9" />
    </linearGradient>
    <linearGradient id="hatRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Circular Moderno com borda dourada sutil de Natal -->
  <circle cx="32" cy="32" r="31" fill="url(#bgGrad)" stroke="#fde047" stroke-width="1.5" />

  <!-- Orelhas Robóticas Articuladas -->
  <path d="M 17 24 L 10 12 L 20 18 Z" fill="#64748b" stroke="#334155" stroke-width="1" />
  <path d="M 47 24 L 54 12 L 44 18 Z" fill="#64748b" stroke="#334155" stroke-width="1" />

  <!-- Cabeça do Robô Dogbot -->
  <rect x="15" y="22" width="34" height="26" rx="8" fill="url(#robotMetal)" stroke="#64748b" stroke-width="1.5" />

  <!-- Visor Cyber de Olhos LED -->
  <rect x="19" y="28" width="26" height="12" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="1" />

  <!-- Olhos LED Cyan Brilhantes (Smart Eyes) -->
  <rect x="22" y="31" width="8" height="6" rx="2" fill="url(#cyanGlow)" filter="url(#glow)" />
  <rect x="34" y="31" width="8" height="6" rx="2" fill="url(#cyanGlow)" filter="url(#glow)" />

  <!-- Focinho e Detalhe de Voz/Speaker -->
  <circle cx="32" cy="43" r="2" fill="#334155" />
  <line x1="28" y1="45" x2="36" y2="45" stroke="#475569" stroke-width="1" stroke-linecap="round" />

  <!-- Gorro de Natal Festivo -->
  <path d="M 20 22 C 22 10, 42 10, 44 22 Z" fill="url(#hatRed)" />
  <path d="M 38 12 Q 48 8, 49 16" stroke="url(#hatRed)" stroke-width="6" stroke-linecap="round" fill="none" />
  <circle cx="50" cy="18" r="3.5" fill="#ffffff" />
  <!-- Barra de pelúcia branca do gorro -->
  <rect x="17" y="20" width="30" height="4.5" rx="2.2" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />
</svg>

