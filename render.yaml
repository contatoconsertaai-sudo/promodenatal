services:
  - type: web
    name: promodenatal
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SYNCPAY_BASE_URL
        value: https://api.syncpayments.com.br
      - key: SYNCPAY_CLIENT_ID
        sync: false
      - key: SYNCPAY_CLIENT_SECRET
        sync: false
      - key: SYNCPAY_WEBHOOK_URL
        sync: false
      - key: TIKTOK_PIXEL_ID
        value: DBMJV8JC77UFMFQAB2G0
      - key: TIKTOK_ACCESS_TOKEN
        sync: false

