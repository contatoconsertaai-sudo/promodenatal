services:
  - type: web
    name: ofersoffshore
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SYNCPAY_BASE_URL
        value: https://api.syncpayments.com.br
      - key: SYNCPAY_CLIENT_ID
        sync: false
      - key: SYNCPAY_CLIENT_SECRET
        sync: false
      - key: SYNCPAY_WEBHOOK_URL
        sync: false
